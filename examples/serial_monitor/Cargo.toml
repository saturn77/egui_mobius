[package]
name = "serial_monitor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
egui_mobius_reactive = { workspace = true }
egui_citizen         = { workspace = true }
egui                 = { workspace = true }
egui_dock            = { workspace = true }
eframe               = { workspace = true, features = ["default"] }
# Cross-platform serial I/O. default-features = false drops the libudev
# requirement on Linux (same choice as blaze2-gui) — port enumeration
# falls back to sysfs, and CI runners need no system packages.
serialport           = { version = "4", default-features = false }
