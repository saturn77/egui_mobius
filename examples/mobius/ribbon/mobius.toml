# Compiler directives for ribbon.mobius — paths resolve relative to this
# file. `mobius-gen examples/ribbon/ribbon.mobius` with no further
# arguments puts the generated project in the workspace's target/tmp,
# built against this checkout's crates. Explicit CLI arguments override
# any of these.

[project]
out = "generated"
mobius_root = "../../.."
asset_root = "."
# crate_name = "ribbon_demo"   # default: snake_case of the app name
