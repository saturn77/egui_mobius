[package]
name = "workbench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Glow renderer, not the default wgpu — resizing under wgpu showed frozen
# frames and black rectangles; CopperTrace ships the same choice.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
egui_lens = { path = "/home/james/raid_one/software_projects/atlantix/Egui/egui_mobius/examples/mobius/terminal/../../../crates/egui_lens" }
egui_citizen = { path = "/home/james/raid_one/software_projects/atlantix/Egui/egui_mobius/examples/mobius/terminal/../../../crates/egui_citizen" }
egui_mobius_reactive = { path = "/home/james/raid_one/software_projects/atlantix/Egui/egui_mobius/examples/mobius/terminal/../../../crates/egui_mobius_reactive" }

# egui repaints continuously while the window resizes — unoptimized debug
# builds freeze. Light opt for the app, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Standalone — never a member of an enclosing workspace.
[workspace]
